<a class="skip-link" href="#main">Skip to content</a>

<header class="app-header" *ngIf="!onLoginPage">
    <div class="header-inner">
        <a class="brand" routerLink="/home" aria-label="Ledger home">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="9" fill="currentColor" />
                <rect x="7" y="16" width="4.5" height="9" rx="1.2" fill="#fff" opacity="0.55" />
                <rect x="13.75" y="11" width="4.5" height="14" rx="1.2" fill="#fff" opacity="0.8" />
                <rect x="20.5" y="6" width="4.5" height="19" rx="1.2" fill="#fff" />
            </svg>
            <span class="brand-name">Ledger</span>
        </a>

        <nav class="nav" aria-label="Main">
            <a class="nav-link" routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">
                <mat-icon aria-hidden="true">space_dashboard</mat-icon>
                <span>Dashboard</span>
            </a>
            <a class="nav-link" routerLink="/planner" routerLinkActive="active" ariaCurrentWhenActive="page">
                <mat-icon aria-hidden="true">event_note</mat-icon>
                <span>Budget planning</span>
            </a>
            <a class="nav-link" routerLink="/transactions" routerLinkActive="active" ariaCurrentWhenActive="page">
                <mat-icon aria-hidden="true">receipt_long</mat-icon>
                <span>Transactions</span>
            </a>
        </nav>

        <div class="header-actions">
            <button type="button" class="icon-btn" (click)="toggleTheme()"
                [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
                [attr.aria-pressed]="isDark">
                <mat-icon aria-hidden="true">{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>
            <button type="button" class="icon-btn" aria-label="Settings">
                <mat-icon aria-hidden="true">settings</mat-icon>
            </button>
            <ng-container *ngIf="user$ | async as user">
                <span class="user-chip" [attr.title]="'Signed in as ' + user.username">{{ user.username }}</span>
                <button type="button" class="icon-btn" (click)="signOut()" aria-label="Sign out">
                    <mat-icon aria-hidden="true">logout</mat-icon>
                </button>
            </ng-container>
        </div>
    </div>
</header>

<div *ngIf="loading$ | async" class="spinner-overlay" role="status" aria-label="Loading">
    <mat-spinner diameter="40"></mat-spinner>
</div>

<main id="main" class="app-main" [class.no-header]="onLoginPage">
    <router-outlet></router-outlet>
</main>
