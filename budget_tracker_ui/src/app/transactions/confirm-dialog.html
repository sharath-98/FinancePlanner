<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p class="message">{{ data.message }}</p>
    <ul *ngIf="data.details?.length" class="details">
        <li *ngFor="let line of data.details">{{ line }}</li>
    </ul>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button type="button" class="btn btn-secondary" [mat-dialog-close]="false">Cancel</button>
    <button type="button" class="btn" [class.danger]="data.danger" [mat-dialog-close]="true" cdkFocusInitial>
        {{ data.confirmLabel }}
    </button>
</mat-dialog-actions>
