<h2 mat-dialog-title>Edit transaction</h2>

<form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <mat-dialog-content>
        <div class="fields">
            <mat-form-field appearance="outline">
                <mat-label>Type</mat-label>
                <mat-select formControlName="type" (selectionChange)="onTypeChange()">
                    <mat-option *ngFor="let t of types" [value]="t">{{ typeLabel(t) }}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Category</mat-label>
                <mat-select formControlName="category">
                    <mat-option *ngFor="let c of categoryChoices" [value]="c.id">{{ c.name }}</mat-option>
                </mat-select>
                <mat-error>Choose a category.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="wide">
                <mat-label>Merchant</mat-label>
                <input matInput formControlName="merchant" maxlength="200" autocomplete="off" />
                <mat-error>Enter a merchant.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Date</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="date" />
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
                <mat-error>Choose a date.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Amount</mat-label>
                <input matInput type="number" step="0.01" min="0.01" inputmode="decimal" formControlName="amount" />
                <span matTextPrefix>$&nbsp;</span>
                <mat-error>Enter an amount above zero.</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Paid by</mat-label>
                <mat-select formControlName="paidby">
                    <mat-option *ngFor="let u of data.users" [value]="u.id">{{ u.name }}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="wide">
                <mat-label>Details</mat-label>
                <input matInput formControlName="details" maxlength="255" autocomplete="off" />
            </mat-form-field>
        </div>

        <p class="error" role="alert" aria-live="polite">{{ errorMessage }}</p>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn" [disabled]="saving || !hasChanges">
            {{ saving ? 'Saving…' : 'Review changes' }}
        </button>
    </mat-dialog-actions>
</form>
